# Nginx reverse proxy for the Multi-Agent Travel Planner.
# Streamlit listens on 127.0.0.1:8501 (see the systemd unit); nginx exposes
# it on port 80 (and 443 after you run certbot).
# ---------------------------------------------------------------------------
# Install on the VPS:
#   sudo cp deploy/nginx-travel-planner.conf /etc/nginx/sites-available/travel-planner
#   sudo ln -s /etc/nginx/sites-available/travel-planner /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # optional: drop the default site
#   sudo nginx -t                                    # test config
#   sudo systemctl reload nginx
#
# Then enable HTTPS (auto-rewrites this file for 443):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;   # <-- change to your domain

    # Streamlit needs WebSocket upgrade headers to work behind a proxy.
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required by Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }
}
